<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>BlinkEye</title>

    <script
      type="module"
      src="/src/main.ts"
      defer
    ></script>
  </head>

  <body>
    <div id="widget">
      <div id="hover-area">
        <svg
          id="eye-open"
          class="eye-svg"
          viewBox="0 0 137 136"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M79.25 68.1667C79.25 74.9205 73.7538 80.4167 67 80.4167C60.2462 80.4167 54.75 74.9205 54.75 68.1667C54.75 61.4128 60.2462 55.9167 67 55.9167C73.7538 55.9167 79.25 61.4128 79.25 68.1667ZM116 66.3333C116 66.3333 98.6377 100.833 67.0613 100.833C37.7429 100.833 18 66.3333 18 66.3333C18 66.3333 36.1545 35.5 67.0613 35.5C98.4784 35.5 116 66.3333 116 66.3333ZM87.4167 68.1667C87.4167 56.9089 78.2578 47.75 67 47.75C55.7423 47.75 46.5833 56.9089 46.5833 68.1667C46.5833 79.4244 55.7423 88.5833 67 88.5833C78.2578 88.5833 87.4167 79.4244 87.4167 68.1667Z" />
          <path d="M70 -2.18557e-07L70 27L65 27L65 0L70 -2.18557e-07Z" />
          <path d="M24.1651 14.25L37.6651 37.6327L33.335 40.1327L19.835 16.75L24.1651 14.25Z" />
          <path d="M45.4148 3.85288L52.4029 29.9329L47.5733 31.227L40.5852 5.14697L45.4148 3.85288Z" />
          <path d="M4.76771 29.7323L23.8596 48.8242L20.3241 52.3597L1.23218 33.2678L4.76771 29.7323Z" />
          <path d="M113.014 13.7373L98.9396 38.1154L103.27 40.6154L117.344 16.2373L113.014 13.7373Z" />
          <path d="M90.8708 2.87192L83.5852 30.0622L88.4148 31.3563L95.7004 4.16602L90.8708 2.87192Z" />
          <path d="M133.22 29.9005L113.316 49.8051L116.851 53.3407L136.756 33.436L133.22 29.9005Z" />
        </svg>

        <svg
          id="eye-closed"
          class="eye-svg"
          viewBox="0 0 137 136"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M70.314 135.427L70.314 108.427L65.314 108.427L65.314 135.427L70.314 135.427Z" />
          <path d="M24.1116 121.221L37.5735 97.9042L33.2434 95.4042L19.7815 118.721L24.1116 121.221Z" />
          <path d="M45.302 131.587L52.2704 105.581L47.4408 104.287L40.4724 130.293L45.302 131.587Z" />
          <path d="M4.76771 105.784L23.8057 86.7458L20.2702 83.2103L1.23218 102.248L4.76771 105.784Z" />
          <path d="M112.698 121.732L98.6628 97.4226L102.993 94.9226L117.028 119.232L112.698 121.732Z" />
          <path d="M90.6162 132.565L83.351 105.451L88.1807 104.157L95.4458 131.271L90.6162 132.565Z" />
          <path d="M132.848 105.616L113 85.7674L116.535 82.2319L136.384 102.081L132.848 105.616Z" />
          <path d="M20.4526 61.9326C26.7487 71.0751 43.8618 92.333 66.8755 92.333C91.538 92.3329 107.529 71.2866 113.349 62.0703C114.969 64.3507 115.803 65.8142 115.814 65.833C115.814 65.833 98.4517 100.333 66.8755 100.333C37.5572 100.333 17.814 65.833 17.814 65.833C17.8252 65.814 18.7249 64.2921 20.4526 61.9326Z" />
        </svg>

        <button id="water-toggle" type="button" aria-label="Water Tracker">
          <span class="water-tooltip">Water Tracker</span>
          <svg class="droplet-icon-svg" viewBox="0 0 28 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 36C8.38709 36 -3.48239e-05 32.6236 0 22.8231C3.48241e-05 13.0226 14 0 14 0C14 0 28 12.6869 28 22.8231C28 32.9592 19.6129 36 14 36Z" fill="currentColor"/>
          </svg>
        </button>

        <button id="settings-toggle" type="button" aria-label="Settings">
          <span class="settings-tooltip">Settings</span>
          <svg class="gear-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24.5264 6.17079C21.8278 6.78811 19.2996 7.85224 17.0234 9.28087L11.0205 6.55301L6.553 11.0205L9.28114 17.0231C7.85247 19.2993 6.78841 21.8275 6.17106 24.5261L-2.86102e-06 26.8408V33.1589L6.17106 35.4736C6.78839 38.1722 7.85248 40.7004 9.28114 42.9766L6.553 48.9795L11.0205 53.447L17.0234 50.7189C19.2996 52.1475 21.8278 53.2116 24.5264 53.8289L26.8408 60H33.1589L35.4739 53.8289C38.1725 53.2116 40.7007 52.1475 42.9769 50.7189L48.9795 53.447L53.447 48.9795L50.7191 42.9766C52.1478 40.7004 53.2119 38.1722 53.8292 35.4736L60 33.1592V26.8411L53.8292 24.5261C53.2119 21.8276 52.1478 19.2993 50.7191 17.0231L53.447 11.0205L48.9795 6.55301L42.9769 9.28087C40.7007 7.85223 38.1724 6.78813 35.4739 6.17079L33.1592 0H26.8411L24.5264 6.17079ZM30 8.33333C41.9662 8.33333 51.6667 18.0338 51.6667 30C51.6667 41.9662 41.9662 51.6667 30 51.6667C18.0338 51.6667 8.33333 41.9662 8.33333 30C8.33333 18.0338 18.0338 8.33333 30 8.33333ZM30 11.4735C19.7681 11.4735 11.4735 19.7681 11.4735 30C11.4735 40.2319 19.7681 48.5265 30 48.5265C40.2319 48.5265 48.5265 40.2319 48.5265 30C48.5265 19.7681 40.2319 11.4735 30 11.4735ZM30.1389 15.2778C38.193 15.2778 44.7222 21.807 44.7222 29.8611C44.7222 37.9153 38.193 44.4444 30.1389 44.4444C22.0847 44.4444 15.5556 37.9153 15.5556 29.8611C15.5556 21.807 22.0847 15.2778 30.1389 15.2778Z" fill="currentColor"/>
          </svg>
        </button>

        <!-- Water Drop Container -->
        <div id="water-drop-wrapper" class="water-drop-wrapper">
          <!-- Action Bar during reminder -->
          <div id="water-action-bar" class="water-action-bar">
            <button type="button" id="water-skip-btn" class="water-pill-btn skip-btn">SKIP</button>
            <button type="button" id="water-one-cup-btn" class="water-pill-btn primary-btn">
              <span id="water-cup-btn-label">1 CUP</span>
            </button>
            <div class="water-custom-wrapper">
              <button type="button" id="water-custom-toggle-btn" class="water-pill-btn custom-btn">INPUT</button>
              <div id="water-custom-popover" class="water-custom-popover">
                <div class="quick-add-group">
                  <button type="button" class="quick-add-btn" data-amount="100">+100</button>
                  <button type="button" class="quick-add-btn" data-amount="250">+250</button>
                  <button type="button" class="quick-add-btn" data-amount="500">+500</button>
                </div>
                <div class="custom-input-row">
                  <input type="number" id="water-custom-input" min="20" max="2000" step="50" value="250" placeholder="ml" />
                  <button type="button" id="water-custom-submit-btn">Add</button>
                </div>
              </div>
            </div>
          </div>

          <!-- SVG Droplet -->
          <svg id="water-droplet-svg" class="water-droplet-svg" viewBox="0 0 144 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="droplet-inner-clip">
                <path d="M61.5 159C36.8433 159 -0.000152976 144.087 0 100.802C0.000152977 57.5164 61.5 0 61.5 0C61.5 0 123 56.034 123 100.802C123 145.57 86.1567 159 61.5 159Z" transform="translate(10.5, 10.5)" />
              </clipPath>
            </defs>

            <!-- Background unfilled reservoir -->
            <path class="droplet-bg" d="M61.5 159C36.8433 159 -0.000152976 144.087 0 100.802C0.000152977 57.5164 61.5 0 61.5 0C61.5 0 123 56.034 123 100.802C123 145.57 86.1567 159 61.5 159Z" transform="translate(10.5, 10.5)" />

            <!-- Clipped liquid level -->
            <g clip-path="url(#droplet-inner-clip)">
              <g id="liquid-fill-group" class="liquid-fill-group">
                <!-- Wave period = 288px; path spans 3 full periods so translation by -288px is seamless -->
                <path id="liquid-wave-path" class="liquid-wave-path" d="M -288,0 C -252,-12 -180,-12 -144,0 C -108,12 -36,12 0,0 C 36,-12 108,-12 144,0 C 180,12 252,12 288,0 C 324,-12 396,-12 432,0 C 468,12 540,12 576,0 L 576,200 L -288,200 Z" />
              </g>
            </g>

            <!-- Droplet Outer Shell -->
            <path class="droplet-outer-shell" d="M71.79 0C71.79 0 143.581 63.4346 143.581 114.115C143.581 164.796 100.573 180 71.79 180C43.0076 180 -0.000178537 163.118 3.55897e-08 114.115C0.000312428 65.1567 71.6615 0.116591 71.79 0ZM71.79 9C71.6682 9.11338 6.83708 69.4533 6.83691 114.874C6.83693 160.337 45.7488 176 71.79 176C97.8313 176 136.744 161.894 136.744 114.874C136.744 67.8536 71.79 9 71.79 9Z" />
          </svg>

          <!-- Manual / Status Info Bar -->
          <div id="water-manual-bar" class="water-manual-bar">
            <button type="button" id="water-minus-btn" class="water-ctrl-btn" title="Undo / Subtract 1 Cup">−</button>
            <span id="water-progress-text" class="water-progress-text">0 / 2000 ml</span>
            <button type="button" id="water-plus-btn" class="water-ctrl-btn" title="Add 1 Cup">+</button>
          </div>
        </div>
      </div>

      <div id="settings-panel">
        <div class="settings-header">
          <span class="settings-title">Settings</span>
        </div>

        <div class="settings-body">
          <!-- Eye Color Group -->
          <div class="settings-group">
            <div class="setting-row">
              <span class="setting-label">Eye Color</span>
              <div class="color-picker-row" id="eye-color-group">
                <button type="button" class="color-swatch active" data-color="#ffffff" style="--swatch-color: #ffffff;" aria-label="White"></button>
                <button type="button" class="color-swatch" data-color="#e0e0e0" style="--swatch-color: #e0e0e0;" aria-label="Light Gray"></button>
                <button type="button" class="color-swatch" data-color="#707070" style="--swatch-color: #707070;" aria-label="Medium Gray"></button>
                <button type="button" class="color-swatch" data-color="#1c1c1c" style="--swatch-color: #1c1c1c;" aria-label="Dark Gray"></button>
                <button type="button" class="color-swatch" data-color="#00e5ff" style="--swatch-color: #00e5ff;" aria-label="Cyan"></button>
                <button type="button" class="color-swatch" data-color="#00e676" style="--swatch-color: #00e676;" aria-label="Green"></button>
                <button type="button" class="color-swatch" data-color="#ff9100" style="--swatch-color: #ff9100;" aria-label="Amber"></button>
                <button type="button" class="color-swatch" data-color="#d500f9" style="--swatch-color: #d500f9;" aria-label="Purple"></button>
                <label class="custom-color-btn" title="Custom Eye Color">
                  <input type="color" id="eye-custom-color" value="#ffffff" />
                  <span class="custom-color-indicator" id="eye-custom-indicator"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- Outline Group -->
          <div class="settings-group">
            <div class="setting-row-split">
              <div class="setting-toggle-item">
                <span class="setting-label">Outline</span>
                <label class="toggle-switch">
                  <input type="checkbox" id="outline-toggle" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <label class="checkbox-label" id="match-color-container">
                <input type="checkbox" id="match-outline-toggle" />
                <span class="checkbox-text">Link to eye</span>
              </label>
            </div>

            <div class="setting-row" id="outline-color-row">
              <span class="setting-sublabel">Outline Color</span>
              <div class="color-picker-row" id="outline-color-group">
                <button type="button" class="color-swatch" data-color="#ffffff" style="--swatch-color: #ffffff;" aria-label="White"></button>
                <button type="button" class="color-swatch" data-color="#e0e0e0" style="--swatch-color: #e0e0e0;" aria-label="Light Gray"></button>
                <button type="button" class="color-swatch" data-color="#707070" style="--swatch-color: #707070;" aria-label="Medium Gray"></button>
                <button type="button" class="color-swatch active" data-color="#2f2f2f" style="--swatch-color: #2f2f2f;" aria-label="Charcoal"></button>
                <button type="button" class="color-swatch" data-color="#000000" style="--swatch-color: #000000;" aria-label="Black"></button>
                <button type="button" class="color-swatch" data-color="#00e5ff" style="--swatch-color: #00e5ff;" aria-label="Cyan"></button>
                <button type="button" class="color-swatch" data-color="#00e676" style="--swatch-color: #00e676;" aria-label="Green"></button>
                <button type="button" class="color-swatch" data-color="#ff9100" style="--swatch-color: #ff9100;" aria-label="Amber"></button>
                <label class="custom-color-btn" title="Custom Outline Color">
                  <input type="color" id="outline-custom-color" value="#2f2f2f" />
                  <span class="custom-color-indicator" id="outline-custom-indicator"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- Behavior Group -->
          <div class="settings-group">
            <div class="setting-row-inline">
              <div class="setting-col-toggle">
                <span class="setting-label">Wiggle</span>
                <label class="toggle-switch">
                  <input type="checkbox" id="wiggle-toggle" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>

              <div class="setting-col-segment">
                <span class="setting-label">Blink Speed</span>
                <div class="segmented-control" id="blink-speed-control">
                  <button type="button" class="segment-btn" data-speed="relaxed">Relaxed</button>
                  <button type="button" class="segment-btn active" data-speed="normal">Normal</button>
                  <button type="button" class="segment-btn" data-speed="active">Active</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Water Reminder Group -->
          <div class="settings-group">
            <div class="setting-row-split">
              <div class="setting-toggle-item">
                <span class="setting-label">Water Reminder</span>
                <label class="toggle-switch">
                  <input type="checkbox" id="water-reminder-toggle" checked />
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <button type="button" id="water-test-btn" class="quick-test-btn">Test Alert</button>
            </div>

            <div class="setting-row" id="water-settings-body">
              <!-- Interval -->
              <div class="setting-subrow">
                <span class="setting-sublabel">Interval</span>
                <div class="segmented-control" id="water-interval-control">
                  <button type="button" class="segment-btn" data-interval="15">15m</button>
                  <button type="button" class="segment-btn active" data-interval="30">30m</button>
                  <button type="button" class="segment-btn" data-interval="45">45m</button>
                  <button type="button" class="segment-btn" data-interval="60">60m</button>
                  <button type="button" class="segment-btn" data-interval="custom">Custom</button>
                </div>
                <div class="custom-input-inline" id="water-custom-interval-container" style="display: none;">
                  <input type="number" id="water-custom-interval-input" min="1" max="240" value="30" />
                  <span class="input-unit">mins</span>
                </div>
              </div>

              <!-- Daily Goal -->
              <div class="setting-subrow">
                <span class="setting-sublabel">Daily Norm</span>
                <div class="segmented-control" id="water-goal-control">
                  <button type="button" class="segment-btn active" data-goal="standard">Standard</button>
                  <button type="button" class="segment-btn" data-goal="active">Active</button>
                  <button type="button" class="segment-btn" data-goal="athlete">Athlete</button>
                  <button type="button" class="segment-btn" data-goal="custom">Custom</button>
                </div>
                <div class="custom-input-inline" id="water-custom-goal-container" style="display: none;">
                  <input type="number" id="water-custom-goal-input" min="500" max="8000" step="100" value="2000" />
                  <span class="input-unit">ml</span>
                </div>
              </div>

              <!-- Cup Size -->
              <div class="setting-subrow">
                <div class="cup-size-header">
                  <span class="setting-sublabel">1 Cup Size</span>
                  <span class="scale-val" id="cup-size-label">250 ml</span>
                </div>
                <div class="segmented-control" id="water-cup-control">
                  <button type="button" class="segment-btn" data-cup="150">150ml</button>
                  <button type="button" class="segment-btn" data-cup="200">200ml</button>
                  <button type="button" class="segment-btn active" data-cup="250">250ml</button>
                  <button type="button" class="segment-btn" data-cup="330">330ml</button>
                  <button type="button" class="segment-btn" data-cup="500">500ml</button>
                </div>
              </div>

              <!-- Today's Intake Status & Reset -->
              <div class="water-status-card">
                <div class="water-status-info">
                  <span class="water-status-label">Today's Progress</span>
                  <span class="water-status-val" id="water-status-val">0 / 2000 ml (0%)</span>
                </div>
                <button type="button" id="water-reset-today-btn" class="water-reset-sm-btn">Reset Today</button>
              </div>
            </div>
          </div>

          <!-- Scale Group -->
          <div class="settings-group">
            <div class="setting-row">
              <div class="scale-header">
                <span class="setting-label">Scale</span>
                <span class="scale-val" id="scale-val-label">1.0x</span>
              </div>
              <div class="segmented-control scale-control" id="scale-control">
                <button type="button" class="segment-btn" data-scale="0.5">0.5x</button>
                <button type="button" class="segment-btn" data-scale="0.75">0.75x</button>
                <button type="button" class="segment-btn active" data-scale="1.0">1.0x</button>
                <button type="button" class="segment-btn" data-scale="1.5">1.5x</button>
                <button type="button" class="segment-btn" data-scale="2.0">2.0x</button>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-footer">
          <button type="button" id="reset-settings-btn" class="reset-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Reset to Defaults
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
